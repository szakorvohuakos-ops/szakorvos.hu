<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tudástár Generátor – Szakorvos.hu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<script>
const SUPABASE_URL='https://asgnkjmwzhbczpvetprh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzZ25ram13emhiY3pwdmV0cHJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzk1NDMsImV4cCI6MjA5MjgxNTU0M30.WCprcmT4oFq1iPfYeQvwGyDv5Vox6YZdn5efouN_Nc0';
const db = supabase.createClient(SUPABASE_URL, SB_KEY);

// ══ AUTH GUARD ══
document.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    window.location.replace('/login.html?redirect=generator');
    return;
  }
  const { data: profile } = await db.from('user_profiles').select('role').eq('id', session.user.id).single();
  if (!profile || profile.role !== 'superadmin') {
    document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;background:#f4f7fc;text-align:center;gap:16px"><div style="font-size:48px">🚫</div><h2 style="color:#1a1f36;margin:0">Hozzáférés megtagadva</h2><p style="color:#6b7280;margin:0">Ez az oldal csak szuperadmin jogosultsággal érhető el.</p><a href="/login.html" style="background:#1e3a8a;color:white;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:700;margin-top:8px">Bejelentkezés</a></div>';
    return;
  }
  loadStats();
});
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── Szín paletta ──
   Elsődleges sötétkék : #283897
   Élénk elektromos kék: #4042e2
   Narancssárga akcentus: #ff6b2b
*/

body{font-family:'Nunito Sans',sans-serif;background:linear-gradient(135deg,#eef0ff 0%,#fff4ef 100%);color:#0f172a;min-height:100vh}

/* NAV */
.nav{
  background:linear-gradient(90deg,#283897 0%,#4042e2 60%,#ff6b2b 100%);
  padding:0 5%;height:64px;display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 24px rgba(40,56,151,0.25);
}
.logo{font-family:'Nunito',sans-serif;font-size:19px;font-weight:900;color:#fff;letter-spacing:-.3px}
.logo em{color:#ffd6bc;font-style:normal}
.nav-sep{color:rgba(255,255,255,0.35);font-size:20px}
.nav-subtitle{font-size:13px;color:rgba(255,255,255,0.75);font-weight:600}
.btn-logout{
  background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.35);
  color:#fff;padding:6px 16px;border-radius:8px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Nunito Sans',sans-serif;transition:all .2s;
  backdrop-filter:blur(4px);
}
.btn-logout:hover{background:rgba(255,255,255,0.28);border-color:rgba(255,255,255,0.6)}

/* WRAP */
.wrap{max-width:860px;margin:0 auto;padding:2rem 1.5rem}

/* HERO / HEADER */
.page-header{
  background:linear-gradient(135deg,#283897 0%,#4042e2 50%,#5a3fd8 100%);
  border-radius:20px;padding:2rem 2.25rem;margin-bottom:1.5rem;
  position:relative;overflow:hidden;
  box-shadow:0 8px 32px rgba(64,66,226,0.3);
}
.page-header::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,107,43,0.18);pointer-events:none;
}
.page-header::after{
  content:'';position:absolute;bottom:-60px;left:30%;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,0.06);pointer-events:none;
}
.page-header h1{
  font-family:'Nunito',sans-serif;font-size:26px;font-weight:900;
  color:#fff;margin-bottom:.3rem;position:relative;z-index:1;
}
.page-header .sub{
  font-size:14px;color:rgba(255,255,255,0.72);margin-bottom:0;
  position:relative;z-index:1;
}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.stat{
  background:#fff;border:1.5px solid #e8edf8;border-radius:16px;
  padding:1.1rem 1.25rem;text-align:center;
  box-shadow:0 2px 12px rgba(40,56,151,0.07);
  transition:transform .2s,box-shadow .2s;
}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(64,66,226,0.15)}
.stat-val{
  font-family:'Nunito',sans-serif;font-size:30px;font-weight:900;
  background:linear-gradient(135deg,#283897,#4042e2);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1;
}
.stat-lbl{font-size:12px;color:#64748b;margin-top:5px;font-weight:600}

/* PROGRESS */
.progress-wrap{
  background:#fff;border:1.5px solid #e8edf8;border-radius:16px;
  padding:1.25rem;margin-bottom:1.5rem;
  box-shadow:0 2px 12px rgba(40,56,151,0.07);
}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.progress-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:#0f172a}
.progress-pct{
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;
  color:#ff6b2b;
}
.bar{height:14px;background:#eef0ff;border-radius:99px;overflow:hidden}
.bar-fill{
  height:100%;
  background:linear-gradient(90deg,#283897,#4042e2,#ff6b2b);
  border-radius:99px;transition:width .5s ease;width:0%;
  box-shadow:0 2px 8px rgba(64,66,226,0.35);
}

/* CONTROLS */
.controls{
  background:#fff;border:1.5px solid #e8edf8;border-radius:16px;
  padding:1.25rem;margin-bottom:1.25rem;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;
  box-shadow:0 2px 12px rgba(40,56,151,0.07);
}
.btn-start{
  background:linear-gradient(135deg,#ff6b2b,#ff8c52);
  color:#fff;border:none;padding:11px 24px;border-radius:10px;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:all .2s;box-shadow:0 4px 14px rgba(255,107,43,0.35);
}
.btn-start:hover{
  background:linear-gradient(135deg,#e85a1e,#ff6b2b);
  transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,107,43,0.45);
}
.btn-start:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-stop{
  background:#fff;border:1.5px solid #e2e8f0;color:#374151;
  padding:10px 20px;border-radius:10px;font-family:'Nunito',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;
}
.btn-stop:hover{border-color:#ef4444;color:#ef4444}
.btn-stop:disabled{opacity:.4;cursor:not-allowed}
select{
  padding:9px 12px;border-radius:10px;
  border:1.5px solid #e8edf8;font-size:13px;
  background:#fff;color:#0f172a;font-family:'Nunito Sans',sans-serif;
  font-weight:600;
}
.status{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:#64748b;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;flex-shrink:0}
.dot.on{background:#22c55e;animation:pulse 1s infinite;box-shadow:0 0 0 3px rgba(34,197,94,0.2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* LOG */
.log-wrap{
  background:#1a1b2e;border-radius:16px;overflow:hidden;
  box-shadow:0 8px 32px rgba(40,56,151,0.2);
  border:1px solid #2d2f4a;
}
.log-header{
  padding:.75rem 1rem;
  background:linear-gradient(90deg,#283897,#4042e2);
  display:flex;align-items:center;justify-content:space-between;
}
.log-title{font-size:12px;font-weight:800;color:#fff;letter-spacing:.1em;text-transform:uppercase}
.log-clear{
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
  cursor:pointer;font-size:11px;color:#fff;font-family:'Nunito Sans',sans-serif;
  padding:3px 10px;border-radius:6px;font-weight:700;transition:all .2s;
}
.log-clear:hover{background:rgba(255,255,255,0.28)}
.log{height:380px;overflow-y:auto;padding:.75rem 1rem;font-size:12px;font-family:monospace;line-height:1.75}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-track{background:#12131f}
.log::-webkit-scrollbar-thumb{background:#4042e2;border-radius:99px}
.l{padding:0;color:#5a6080}
.ok{color:#4ade80}
.err{color:#f87171}
.info{color:#a5b4fc;font-weight:bold}
.warn{color:#fbbf24}
</style>
</head>
<body>

<nav class="nav">
  <div class="logo">Szakorvos<em>.hu</em></div>
  <span class="nav-sep">|</span>
  <span class="nav-subtitle">Tudástár Cikk Generátor</span>
  <span style="margin-left:auto">
    <button onclick="logoutGen()" class="btn-logout">Kijelentkezés</button>
  </span>
</nav>

<div class="wrap">
  <div class="page-header">
    <h1>⚡ Tudástár Cikk Generátor</h1>
    <p class="sub">Az Edge Function automatikusan megírja és feltölti az összes hiányzó cikket</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="sTotal">–</div><div class="stat-lbl">Összes cikk</div></div>
    <div class="stat"><div class="stat-val" id="sDone">–</div><div class="stat-lbl">Kész</div></div>
    <div class="stat"><div class="stat-val" id="sMissing">–</div><div class="stat-lbl">Hiányzó</div></div>
    <div class="stat"><div class="stat-val" id="sSession">0</div><div class="stat-lbl">Most generált</div></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span class="progress-title">Haladás</span>
      <span class="progress-pct" id="pct">0%</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <div class="controls">
    <button class="btn-start" id="btnStart" onclick="startGen()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Generálás indítása
    </button>
    <button class="btn-stop" id="btnStop" onclick="stopGen()" disabled>■ Megállít</button>
    <select id="batch">
      <option value="3">3 cikk / kör</option>
      <option value="5" selected>5 cikk / kör</option>
      <option value="10">10 cikk / kör</option>
    </select>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="statusMsg">Betöltés...</span>
    </div>
  </div>

  <div class="log-wrap">
    <div class="log-header">
      <span class="log-title">LOG</span>
      <button class="log-clear" onclick="clearLog()">Törlés</button>
    </div>
    <div class="log" id="log">
      <div class="l info">Szakorvos.hu Cikk Generátor</div>
      <div class="l">Hitelesítés és adatok betöltése...</div>
    </div>
  </div>
</div>

<script>
const FN_URL = 'https://asgnkjmwzhbczpvetprh.supabase.co/functions/v1/generate-articles';

let running = false, session = 0;
const $ = id => document.getElementById(id);

function log(msg, cls='l') {
  const el = $('log');
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = '[' + new Date().toLocaleTimeString('hu') + '] ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function clearLog() { $('log').innerHTML = ''; }

function updateStats(total, done) {
  $('sTotal').textContent = total.toLocaleString('hu');
  $('sDone').textContent = done.toLocaleString('hu');
  $('sMissing').textContent = (total - done).toLocaleString('hu');
  $('sSession').textContent = session;
  const pct = total > 0 ? (done / total * 100).toFixed(1) : 0;
  $('barFill').style.width = pct + '%';
  $('pct').textContent = pct + '%';
  $('statusMsg').textContent = pct + '% kész – ' + done + ' / ' + total;
}

async function loadStats() {
  try {
    const { data: { session: s } } = await db.auth.getSession();
    const token = s?.access_token || SB_KEY;
    const res = await fetch(FN_URL + '/stats', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    if (data.total) {
      updateStats(data.total, data.done);
      log('Adatok betöltve: ' + data.done + ' / ' + data.total + ' cikk kész', 'ok');
    }
  } catch(e) {
    log('Betöltési hiba: ' + e.message, 'err');
    $('statusMsg').textContent = 'Hiba a betöltésnél';
  }
}

async function startGen() {
  running = true;
  $('btnStart').disabled = true;
  $('btnStop').disabled = false;
  $('dot').classList.add('on');
  log('Generálás elindítva!', 'info');

  const batchSize = parseInt($('batch').value);
  let total = parseInt($('sTotal').textContent.replace(/\s/g,'')) || 3012;
  let done = parseInt($('sDone').textContent.replace(/\s/g,'')) || 0;
  const { data: { session: s } } = await db.auth.getSession();
  const token = s?.access_token || SB_KEY;

  while (running) {
    try {
      log('Batch küldése (' + batchSize + ' cikk)...');
      const res = await fetch(FN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ batch_size: batchSize })
      });

      if (!res.ok) {
        const err = await res.text();
        log('Edge Function hiba (' + res.status + '): ' + err.slice(0, 200), 'err');
        await sleep(5000);
        continue;
      }

      const data = await res.json();
      if (data.done) { log('🎉 Minden cikk kész!', 'info'); running = false; break; }
      if (data.error) { log('Hiba: ' + data.error, 'err'); await sleep(3000); continue; }

      for (const r of data.results || []) {
        if (r.ok) { done++; session++; $('sSession').textContent = session; log('✓ ' + r.title + ' [' + r.specialty + ']', 'ok'); }
        else log('✗ ' + r.title + ': ' + (r.error || 'ismeretlen hiba'), 'err');
      }

      updateStats(total, done);
      await sleep(1500);
    } catch(e) {
      log('Hálózati hiba: ' + e.message, 'err');
      await sleep(5000);
    }
  }

  $('btnStart').disabled = false;
  $('btnStop').disabled = true;
  $('dot').classList.remove('on');
  if (!running) log('Leállítva. Ebben a futásban generált: ' + session + ' cikk', 'warn');
}

function stopGen() { running = false; $('btnStop').disabled = true; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function logoutGen() {
  await db.auth.signOut();
  window.location.replace('/login.html');
}
</script>
</body>
</html>

name: SEO-oldalak és sitemap frissítése

on:
  schedule:
    - cron: '17 3 * * *'   # naponta 05:17 (magyar idő, nyári időszámítás)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/seo/**'
      - '.github/workflows/seo.yml'

permissions:
  contents: write

concurrency:
  group: seo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Oldalak generálása az adatbázisból
        run: node scripts/seo/build.mjs
      - name: Változások feltöltése
        run: |
          git config user.name "szakorvos-seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A szakorvos sitemap.xml sitemap-*.xml
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "SEO-oldalak és sitemap frissítése"
            git push
          fi

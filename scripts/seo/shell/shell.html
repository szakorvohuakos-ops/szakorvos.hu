#sknav,#skfoot{--blue: #2A4A9C;--blue-deep: #1D3574;--blue-soft: #EBF0F8;--blue-line: #B9C6E2;--green: #4E9A32;--green-deep: #4E9A32;--green-soft: #EAF5E3;--teal: #4E9A32;--teal-soft: #EAF5E3;--amber: #F0B32B;--amber-soft: #FDF4E1;--coral: #D9552B;--coral-soft: #FAE7DE;--violet: #3B62C4;--violet-soft: #E5EAF6;--ink: #0B1633;--navy: #0B1633;--muted: #44506A;--line: #E2E6EF;--bg: #FFFFFF;--bg2: #F3F5F9;--r: 12px;--muted2: #7A8396;--line2: #CDD3E0;--hair: rgba(0,0,0,.08);--blue-h: #1D3574;--link: #2A4A9C;--sf: -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;--ease: cubic-bezier(.28,.11,.32,1);}

nav#sknav{position: sticky; top: 0px; z-index: 20; background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); transition: box-shadow 0.2s;}

#sknav .links{display: flex; align-items: center; gap: 4px; height: 100%;}
#sknav .links .dd > a{display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0px 13px; border-radius: 9px; color: var(--ink); font-weight: 600; font-size: 15px; line-height: 1; position: relative; transition: color 0.15s, background 0.15s; white-space: nowrap;}

#sknav .dd{position: relative; display: flex; align-items: center;}
#sknav .chev{width: 15px; height: 15px; opacity: 0.6; transition: transform 0.2s; flex: 0 0 auto; margin-top: 1px;}
#sknav .dd:hover .chev,#sknav .dd:focus-within .chev{transform: rotate(180deg); opacity: 1;}
#sknav .menu{position: absolute; left: 0px; top: calc(100% + 4px); min-width: 236px; background: rgb(255, 255, 255); border: 1px solid var(--line); border-radius: 14px; box-shadow: rgba(42, 74, 156, 0.28) 0px 24px 48px -20px, rgba(42, 74, 156, 0.06) 0px 2px 6px; padding: 8px; display: none; flex-direction: column; z-index: 30; animation: 0.16s ease-out 0s 1 normal none running menuIn;}
@keyframes menuIn { 
  0% { opacity: 0; transform: translateY(-4px); }
  100% { opacity: 1; transform: none; }
}
#sknav .menu::before{content: ""; position: absolute; left: 0px; right: 0px; top: -8px; height: 8px;}
#sknav .dd:hover .menu,#sknav .dd:focus-within .menu{display: flex;}
#sknav .menu a{padding: 9px 12px; border-radius: 9px; font-size: 14.5px; font-weight: 500; color: var(--ink); white-space: nowrap; transition: background 0.12s, color 0.12s; line-height: 1.3;}
#sknav .menu a:hover{background: var(--blue-soft); color: var(--blue);}
#sknav .menu.cols{display: none; flex-direction: row; gap: 8px; padding: 16px; min-width: 600px;}

#sknav .menu a.all{color: var(--blue); font-weight: 600; margin-top: 6px;}
#sknav .navr{display: flex; align-items: center; gap: 8px; margin-left: auto; flex: 0 0 auto;}
#sknav .user{display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0px 13px; border-radius: 9px; color: var(--ink); font-weight: 600; font-size: 15px; line-height: 1; transition: background 0.15s, color 0.15s;}
#sknav .user svg{width: 17px; height: 17px; flex: 0 0 auto;}
#sknav .user:hover{background: var(--blue-soft); color: var(--blue);}
#sknav .cta{display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--blue); color: rgb(255, 255, 255); font-weight: 700; border-radius: 10px; font-size: 15px; line-height: 1;}

#sknav .burger span{display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 2px; transition: transform 0.2s, opacity 0.2s;}

#sknav .burger[aria-expanded="true"] span:nth-child(3){transform: translateY(-7px) rotate(-45deg);}
#sknav .mobnav{display: none; flex-direction: column; border-top: 1px solid var(--line); background: rgb(255, 255, 255); padding: 8px 20px 16px; max-height: calc(-68px + 100vh); overflow: auto;}

  position:sticky;top:0;z-index:900;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--nv-line);box-shadow:none;font-family:inherit}

#sknav .nv-pan h5{margin:2px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--nv-mut)}
#sknav .nv-pan a{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;color:var(--nv-ink);font-size:14.5px;font-weight:500;line-height:1.3;white-space:nowrap;text-decoration:none}
#sknav .nv-pan a:hover{background:var(--nv-blue-s);color:var(--nv-blue)}
#sknav .nv-pan a.nv-all{color:var(--nv-blue);font-weight:700;margin-top:2px}
#sknav .nv-pan a[aria-current="page"],#sknav .nv-acc-b a[aria-current="page"]{color:var(--nv-blue);font-weight:700}
#sknav .nv-tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,#5E9E43,#4A8230);border-radius:6px;padding:2px 6px;line-height:1.2}
#sknav .nv-side{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
#sknav .nv-user{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:10px;color:var(--nv-ink);font-size:14.5px;font-weight:600;text-decoration:none;white-space:nowrap}
#sknav .nv-user:hover{background:var(--nv-blue-s);color:var(--nv-blue)}
#sknav .nv-user svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
#sknav .nv-cta{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:10px;background:var(--nv-blue);color:#fff;font-size:14.5px;font-weight:700;text-decoration:none;white-space:nowrap;box-shadow:0 6px 16px -10px rgba(29,73,146,.8)}
#sknav .nv-cta:hover{background:#163A78;color:#fff}
#sknav .nv-burger{display:none;width:40px;height:40px;border:1px solid var(--nv-line);border-radius:11px;background:#fff;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0}
#sknav .nv-burger span{display:block;width:18px;height:2px;border-radius:2px;background:var(--nv-ink);transition:transform .2s,opacity .2s!important}
#sknav .nv-burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
#sknav .nv-burger[aria-expanded="true"] span:nth-child(2){opacity:0}
#sknav .nv-burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
/* mobil fiók */
#sknav .nv-drawer{position:fixed;left:0;right:0;bottom:0;top:var(--nv-h,59px);background:rgba(11,22,51,.28);z-index:950}
#sknav .nv-drawer[hidden]{display:none}
#sknav .nv-dr-in{background:#fff;max-height:100%;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--nv-line);box-shadow:0 24px 40px -20px rgba(11,22,51,.35);animation:nvDr .18s ease-out!important}
@keyframes nvDr{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#sknav .nv-dr-search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;margin:2px 0 8px;border:1.5px solid #D5DDEB;border-radius:14px;background:#F7F9FD;color:var(--nv-mut);font-size:15px;font-weight:600;text-decoration:none}
#sknav .nv-dr-search svg{width:19px;height:19px;fill:none;stroke:var(--nv-blue);stroke-width:2.2;stroke-linecap:round}
#sknav .nv-acc{border-bottom:1px solid var(--nv-line)}
#sknav .nv-acc-h{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;height:52px;padding:0 4px;border:0;background:none;color:var(--nv-ink);font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-align:left}
#sknav .nv-acc.cur .nv-acc-h{color:var(--nv-blue)}
#sknav .nv-acc-h .nv-chev{width:18px;height:18px}
#sknav .nv-acc-b{display:none;flex-direction:column;padding:0 0 10px}
#sknav .nv-acc.open .nv-acc-b{display:flex}
#sknav .nv-acc-b a{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:10px;color:#2B3650;font-size:15px;font-weight:500;text-decoration:none}
#sknav .nv-acc-b a:active,#sknav .nv-acc-b a:hover{background:var(--nv-blue-s);color:var(--nv-blue)}
#sknav .nv-dr-link{display:flex;align-items:center;height:52px;padding:0 4px;color:var(--nv-ink);font-size:16px;font-weight:700;text-decoration:none;border-bottom:1px solid var(--nv-line)}
#sknav .nv-dr-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
#sknav .nv-dr-btn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none}
#sknav .nv-dr-btn.p{background:var(--nv-blue);color:#fff}
#sknav .nv-dr-btn.s{background:#fff;color:var(--nv-blue);border:1.5px solid #C9D6EE}
html.nv-lock,html.nv-lock body{overflow:hidden!important}
#sknav.nv.dr-open{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:#fff!important;z-index:2000!important}
@media (max-width:1120px){#sknav .nv-top{padding:0 9px;font-size:14px}#sknav .nv-user span{display:none}#sknav .nv-user{padding:0 10px}#sknav.nv .brand{margin-right:8px}}
@media (max-width:1023px){#sknav .nv-main,#sknav .nv-user{display:none}#sknav .nv-burger{display:flex}}
@media (max-width:640px){#sknav .nv-bar{height:58px;gap:6px}#sknav .nv-cta{height:36px;padding:0 12px;font-size:13.5px}#sknav .nv-burger{width:38px;height:38px}}
@media (max-width:360px){#sknav .nv-cta{display:none}}
@media (prefers-reduced-motion:reduce){#sknav .nv-it.open .nv-pan,#sknav .nv-dr-in{animation:none!important}}
</style>
<script>
/* szakorvos.hu – fő navigáció v2 (2026.10) */
(function(){
'use strict';
var nav=document.getElementById('sknav'); if(!nav||nav.__nv) return; nav.__nv=1;
var items=[].slice.call(nav.querySelectorAll('.nv-it')), burger=nav.querySelector('.nv-burger'), drawer=document.getElementById('nv-drawer');
var fine=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches, tClose=null;

/* görgetés-árnyék */
function sc(){ nav.classList.toggle('scrolled',window.scrollY>8); } sc(); window.addEventListener('scroll',sc,{passive:true});

/* asztali lenyíló menük */
function setOpen(it,on){ it.classList.toggle('open',on); var b=it.querySelector('.nv-top'); if(b) b.setAttribute('aria-expanded',on?'true':'false'); }
function closeAll(ex){ items.forEach(function(it){ if(it!==ex) setOpen(it,false); }); }
items.forEach(function(it){
  var b=it.querySelector('.nv-top');
  b.addEventListener('click',function(e){ e.stopPropagation(); var on=!it.classList.contains('open')||(Date.now()-(it._ho||0)<600); closeAll(it); setOpen(it,on); if(on&&e.detail===0){ var f=it.querySelector('.nv-pan a'); if(f) f.focus(); } });
  if(fine){
    it.addEventListener('mouseenter',function(){ clearTimeout(tClose); if(!it.classList.contains('open')) it._ho=Date.now(); closeAll(it); setOpen(it,true); });
    it.addEventListener('mouseleave',function(){ clearTimeout(tClose); tClose=setTimeout(function(){ setOpen(it,false); },180); });
  }
  it.addEventListener('keydown',function(e){
    var links=[].slice.call(it.querySelectorAll('.nv-pan a')), i=links.indexOf(document.activeElement);
    if(e.key==='Escape'){ setOpen(it,false); b.focus(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); if(!it.classList.contains('open')){ closeAll(it); setOpen(it,true); } (links[i+1]||links[0]).focus(); }
    else if(e.key==='ArrowUp'&&i>=0){ e.preventDefault(); (links[i-1]||links[links.length-1]).focus(); }
  });
  it.addEventListener('focusout',function(e){ if(!it.contains(e.relatedTarget)) setOpen(it,false); });
  [].forEach.call(it.querySelectorAll('.nv-pan a'),function(a){ a.addEventListener('click',function(){ setOpen(it,false); }); });
});
document.addEventListener('click',function(e){ if(!nav.contains(e.target)) closeAll(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeAll(); if(drawer&&!drawer.hidden){ setDrawer(false); burger.focus(); } } });

/* mobil fiók */
function setDrawer(on){
  if(!drawer) return;
  if(on) closeAll();
  nav.style.setProperty('--nv-h',Math.round(nav.getBoundingClientRect().bottom)+'px');
  drawer.hidden=!on; burger.setAttribute('aria-expanded',on?'true':'false'); burger.setAttribute('aria-label',on?'Menü bezárása':'Menü megnyitása');
  document.documentElement.classList.toggle('nv-lock',on);
  nav.classList.toggle('dr-open',on);
}
if(burger&&drawer){
  burger.addEventListener('click',function(){ setDrawer(drawer.hidden); });
  drawer.addEventListener('click',function(e){ if(e.target===drawer) setDrawer(false); });
  [].forEach.call(drawer.querySelectorAll('a'),function(a){ a.addEventListener('click',function(){ setDrawer(false); }); });
  [].forEach.call(drawer.querySelectorAll('.nv-acc-h'),function(h){ h.addEventListener('click',function(){ var acc=h.parentNode, on=!acc.classList.contains('open'); acc.classList.toggle('open',on); h.setAttribute('aria-expanded',on?'true':'false'); }); });
  window.addEventListener('resize',function(){ if(!drawer.hidden&&window.innerWidth>1023) setDrawer(false); });
}

/* aktuális oldal jelölése */
var p=location.pathname.replace(/\.html$/,'').replace(/\/+$/,'')||'/', sec=null;
if(/^\/(talalatok|szakorvos|orvos)(\/|$)/.test(p)||/^\/[a-z-]+\/dr-/.test(p)) sec='orvos';
else if(/^\/(klinikak|klinika)(\/|$)/.test(p)) sec='rendelo';
else if(/^\/vizsgalat/.test(p)) sec='vizsg';
else if(/^\/tudastar/.test(p)) sec='tudas';
else if(/^\/(register|demo-orvos|demo-klinika|login|kapcsolat|admin-orvos|admin-klinika)$/.test(p)) sec='partner';
if(sec){ [].forEach.call(nav.querySelectorAll('[data-sec="'+sec+'"]'),function(x){ x.classList.add('cur'); if(x.classList.contains('nv-acc')){ x.classList.add('open'); var h=x.querySelector('.nv-acc-h'); if(h) h.setAttribute('aria-expanded','true'); } }); }
var here=location.pathname+location.search;
[].forEach.call(nav.querySelectorAll('.nv-pan a,.nv-acc-b a'),function(a){ var u=a.getAttribute('href')||''; if(u.indexOf('#')<0&&(u===here||u.replace(/\.html$/,'')===p)) a.setAttribute('aria-current','page'); });

/* „Rendelők a térképen”: a főoldalon modál (index kezeli), a klinikalistán a térkép megnyitása */
function openMapHere(){ var t=document.getElementById('mtog'); if(t&&t.offsetParent){ t.click(); return true; } var m=document.getElementById('mapCol')||document.getElementById('gmap'); if(m){ m.scrollIntoView({behavior:'smooth',block:'start'}); return true; } return false; }
if(location.hash==='#terkep'&&/^\/klinikak/.test(p)) setTimeout(openMapHere,600);
[].forEach.call(nav.querySelectorAll('a[href="/klinikak#terkep"]'),function(a){ a.addEventListener('click',function(e){ if(/^\/klinikak/.test(p)&&openMapHere()) e.preventDefault(); }); });
})();

</script>

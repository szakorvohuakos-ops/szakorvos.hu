<style id="landing-shell">

#sknav,#skfoot{--blue: #183AA5;--blue-deep: #12308F;--blue-soft: #EAEFFB;--blue-line: #C4CFF0;--green: #2C9650;--green-deep: #1F7A3E;--green-soft: #E3F3E8;--teal: #1497A8;--teal-soft: #E0F4F6;--amber: #E39A2B;--amber-soft: #FCF0DA;--coral: #E0503A;--coral-soft: #FBE5E0;--violet: #6B4FD8;--violet-soft: #ECE8FB;--ink: #1B2338;--navy: #1B2338;--muted: #5B6478;--line: #E2E6EF;--bg: #FFFFFF;--bg2: #F5F7FC;--r: 12px;--muted2: #7A8396;--line2: #CDD3E0;--hair: rgba(0,0,0,.08);--blue-h: #12308F;--link: #183AA5;--sf: -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;--ease: cubic-bezier(.28,.11,.32,1);}
#sknav *,#skfoot *{box-sizing: border-box;}
#sknav button{font: inherit; color: inherit;}
#sknav a,#skfoot a{color: inherit; text-decoration: none;}
#sknav .wrap,#skfoot .wrap{max-width: 1040px; margin: 0px auto; padding: 0px 24px;}
nav#sknav .wrap{max-width: 1240px;}
nav#sknav{position: sticky; top: 0px; z-index: 20; background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); transition: box-shadow 0.2s;}
nav#sknav.scrolled{box-shadow: rgba(24, 58, 165, 0.35) 0px 6px 24px -18px;}
nav#sknav .wrap{display: flex; align-items: center; height: 68px; gap: 0px;}
#sknav .brand,#skfoot .brand{display: flex; align-items: center; gap: 10px; flex: 0 0 auto; line-height: 1; margin-right: 36px;}
#sknav .logo,#skfoot .logo{width: 32px; height: 32px; display: grid; place-items: center; flex: 0 0 auto;}
#sknav .logo svg,#skfoot .logo svg{width: 100%; height: 100%; display: block;}
#sknav .wm,#skfoot .wm{font-size: 22px; font-weight: 700; letter-spacing: -0.03em; color: var(--blue); line-height: 1; transform: translateY(1px);}
#sknav .wm em,#skfoot .wm em{font-style: normal; color: var(--green);}
#sknav .links{display: flex; align-items: center; gap: 4px; height: 100%;}
#sknav .links .dd > a{display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0px 13px; border-radius: 9px; color: var(--ink); font-weight: 600; font-size: 15px; line-height: 1; position: relative; transition: color 0.15s, background 0.15s; white-space: nowrap;}
#sknav .links .dd > a:hover,#sknav .links .dd:hover > a,#sknav .links .dd:focus-within > a{color: var(--blue); background: var(--blue-soft);}
#sknav .dd{position: relative; display: flex; align-items: center;}
#sknav .chev{width: 15px; height: 15px; opacity: 0.6; transition: transform 0.2s; flex: 0 0 auto; margin-top: 1px;}
#sknav .dd:hover .chev,#sknav .dd:focus-within .chev{transform: rotate(180deg); opacity: 1;}
#sknav .menu{position: absolute; left: 0px; top: calc(100% + 4px); min-width: 236px; background: rgb(255, 255, 255); border: 1px solid var(--line); border-radius: 14px; box-shadow: rgba(24, 58, 165, 0.28) 0px 24px 48px -20px, rgba(24, 58, 165, 0.06) 0px 2px 6px; padding: 8px; display: none; flex-direction: column; z-index: 30; animation: 0.16s ease-out 0s 1 normal none running menuIn;}
@keyframes menuIn { 
  0% { opacity: 0; transform: translateY(-4px); }
  100% { opacity: 1; transform: none; }
}
#sknav .menu::before{content: ""; position: absolute; left: 0px; right: 0px; top: -8px; height: 8px;}
#sknav .dd:hover .menu,#sknav .dd:focus-within .menu{display: flex;}
#sknav .menu a{padding: 9px 12px; border-radius: 9px; font-size: 14.5px; font-weight: 500; color: var(--ink); white-space: nowrap; transition: background 0.12s, color 0.12s; line-height: 1.3;}
#sknav .menu a:hover{background: var(--blue-soft); color: var(--blue);}
#sknav .menu.cols{display: none; flex-direction: row; gap: 8px; padding: 16px; min-width: 600px;}
#sknav .dd:hover .menu.cols,#sknav .dd:focus-within .menu.cols{display: flex;}
#sknav .menu.cols > div{display: flex; flex-direction: column; min-width: 170px;}
#sknav .menu.cols > div + div{border-left: 1px solid var(--line); padding-left: 8px;}
#sknav .menu h5{margin: 2px 12px 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);}
#sknav .menu a.all{color: var(--blue); font-weight: 600; margin-top: 6px;}
#sknav .navr{display: flex; align-items: center; gap: 8px; margin-left: auto; flex: 0 0 auto;}
#sknav .user{display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0px 13px; border-radius: 9px; color: var(--ink); font-weight: 600; font-size: 15px; line-height: 1; transition: background 0.15s, color 0.15s;}
#sknav .user svg{width: 17px; height: 17px; flex: 0 0 auto;}
#sknav .user:hover{background: var(--blue-soft); color: var(--blue);}
#sknav .cta{display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--blue); color: rgb(255, 255, 255); font-weight: 700; border-radius: 10px; font-size: 15px; line-height: 1;}
#sknav .cta:hover{background: var(--blue-deep);}
#sknav .cta.sm{height: 40px; padding: 0px 18px; margin-left: 4px; box-shadow: rgba(24, 58, 165, 0.7) 0px 6px 16px -10px;}
#sknav .burger{display: none; width: 40px; height: 40px; border: 1px solid var(--line); background: rgb(255, 255, 255); border-radius: 10px; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 0px; margin-left: 4px;}
#sknav .burger span{display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 2px; transition: transform 0.2s, opacity 0.2s;}
#sknav .burger[aria-expanded="true"] span:nth-child(1){transform: translateY(7px) rotate(45deg);}
#sknav .burger[aria-expanded="true"] span:nth-child(2){opacity: 0;}
#sknav .burger[aria-expanded="true"] span:nth-child(3){transform: translateY(-7px) rotate(-45deg);}
#sknav .mobnav{display: none; flex-direction: column; border-top: 1px solid var(--line); background: rgb(255, 255, 255); padding: 8px 20px 16px; max-height: calc(-68px + 100vh); overflow: auto;}
#sknav .mobnav.on{display: flex;}
#sknav .mobnav h5{margin: 14px 0px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);}
#sknav .mobnav a{padding: 10px 4px; font-weight: 600; font-size: 15.5px; color: var(--ink);}
#sknav .mobnav a.acc{color: var(--blue);}

footer#skfoot{border-top: 1px solid var(--line); padding: 40px 0px; color: var(--muted); font-size: 14px;}

<script>
(function(){
  var nav=document.getElementById('sknav'); if(!nav) return;
  function up(){ nav.classList.toggle('scrolled',window.scrollY>8); } up(); window.addEventListener('scroll',up,{passive:true});
  var burger=document.getElementById('burger'), mob=document.getElementById('mobnav');
  if(burger&&mob){ burger.addEventListener('click',function(){ var on=burger.getAttribute('aria-expanded')!=='true'; burger.setAttribute('aria-expanded',on?'true':'false'); mob.classList.toggle('on',on); });
    [].forEach.call(mob.querySelectorAll('a'),function(a){ a.addEventListener('click',function(){ burger.setAttribute('aria-expanded','false'); mob.classList.remove('on'); }); }); }
})();
</script>

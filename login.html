<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bejelentkezés – Szakorvos.hu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito Sans', sans-serif;
  background: #f0f4ff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.card {
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 8px 48px rgba(40,56,151,0.12);
  width: 100%;
  max-width: 420px;
  padding: 2.5rem 2rem;
}
.logo {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-bottom: 2rem; text-decoration: none;
}
.logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #283897, #4042e2);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(40,56,151,0.3);
}
.logo-text { font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900; color: #283897; }
.logo-text em { color: #ff6b2b; font-style: normal; }
.heading { text-align: center; margin-bottom: 2rem; }
.heading h1 { font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900; color: #0f172a; margin-bottom: 6px; }
.heading p { font-size: 14px; color: #6b7280; line-height: 1.6; }
.form-group { margin-bottom: 1rem; }
label { display: block; font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.input-wrap { position: relative; }
.input-wrap .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9aa5c4; pointer-events: none; }
input[type=email], input[type=password], input[type=text] {
  width: 100%; border: 1.5px solid #e8edf8; border-radius: 12px;
  padding: 12px 14px 12px 44px; font-size: 15px;
  font-family: 'Nunito Sans', sans-serif; color: #0f172a;
  outline: none; background: #fff; transition: border-color .2s, box-shadow .2s;
}
input:focus { border-color: #283897; box-shadow: 0 0 0 3px rgba(40,56,151,0.1); }
.pw-toggle {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: #9aa5c4; padding: 4px; transition: color .2s;
}
.pw-toggle:hover { color: #283897; }
.form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.remember { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #6b7280; cursor: pointer; user-select: none; }
.remember input { accent-color: #283897; width: 15px; height: 15px; cursor: pointer; }
.forgot { font-size: 13px; font-weight: 600; color: #283897; text-decoration: none; transition: color .2s; }
.forgot:hover { color: #ff6b2b; }
.btn-submit {
  width: 100%; background: linear-gradient(135deg, #283897, #4042e2);
  color: #fff; border: none; border-radius: 12px; padding: 14px;
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 18px rgba(40,56,151,0.3); transition: all .2s;
}
.btn-submit:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(40,56,151,0.35); }
.btn-submit:active { transform: none; }
.btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.msg {
  border-radius: 11px; padding: .85rem 1rem; font-size: 13.5px; font-weight: 600;
  display: none; align-items: center; gap: 9px; margin-bottom: 1rem;
  animation: msgIn .2s ease;
}
@keyframes msgIn { from { opacity:0; transform:translateY(-4px) } to { opacity:1; transform:none } }
.msg.show { display: flex; }
.msg-error { background: #fee2e2; border: 1.5px solid #fca5a5; color: #b91c1c; }
.msg-success { background: #ecfdf5; border: 1.5px solid #bbf7d0; color: #065f46; }
.divider { display: flex; align-items: center; gap: 12px; margin: 1.25rem 0; color: #9aa5c4; font-size: 12px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e8edf8; }
.btn-google {
  width: 100%; background: #fff; color: #0f172a; border: 1.5px solid #e8edf8;
  border-radius: 12px; padding: 12px; font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 9px; transition: all .2s;
}
.btn-google:hover { border-color: #283897; background: #f8faff; }
.spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.back-link {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin-top: 1.5rem; font-size: 13px; color: #9aa5c4; text-decoration: none; transition: color .2s;
}
.back-link:hover { color: #283897; }
@media (max-width: 480px) { .card { padding: 2rem 1.5rem; } }
</style>
</head>
<body>
<div class="card">

  <a href="index.html" class="logo">
    <div class="logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
    <span class="logo-text">Szakorvos<em>.hu</em></span>
  </a>

  <div class="heading">
    <h1>Üdvözöljük!</h1>
    <p>Lépjen be fiókjába az email cím és jelszó megadásával</p>
  </div>

  <div class="msg msg-error" id="msgError">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    <span id="msgErrorText">Hibás email cím vagy jelszó.</span>
  </div>
  <div class="msg msg-success" id="msgSuccess">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="msgSuccessText">Sikeres bejelentkezés! Átirányítás…</span>
  </div>

  <form onsubmit="handleLogin(event)" novalidate>
    <div class="form-group">
      <label>Email cím</label>
      <div class="input-wrap">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="email" placeholder="pelda@email.hu" autocomplete="email" required>
      </div>
    </div>
    <div class="form-group">
      <label>Jelszó</label>
      <div class="input-wrap">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" onclick="togglePw()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="form-row">
      <label class="remember"><input type="checkbox" id="rememberMe"> Emlékezzen rám</label>
      <a href="#" class="forgot" onclick="forgotPassword(event)">Elfelejtett jelszó?</a>
    </div>
    <button type="submit" class="btn-submit" id="loginBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="loginIcon"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      <span id="loginBtnText">Bejelentkezés</span>
    </button>
  </form>

  <div class="divider">vagy</div>

  <button class="btn-google" onclick="loginWithGoogle()">
    <svg width="18" height="18" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Folytatás Google-lel
  </button>

  <a href="index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    Vissza a főoldalra
  </a>

</div>

<script>
const SUPABASE_URL = 'https://asgnkjmwzhbczpvetprh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzZ25ram13emhiY3pwdmV0cHJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzk1NDMsImV4cCI6MjA5MjgxNTU0M30.WCprcmT4oFq1iPfYeQvwGyDv5Vox6YZdn5efouN_Nc0';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLE_REDIRECTS = {
  superadmin:   'admin.html',
  doctor_admin: 'admin-orvos.html',
  clinic_admin: 'admin-klinika.html',
  patient:      'index.html',
};

let pwVisible = false;

function togglePw() {
  pwVisible = !pwVisible;
  document.getElementById('password').type = pwVisible ? 'text' : 'password';
  document.getElementById('eyeIcon').innerHTML = pwVisible
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

async function handleLogin(e) {
  e.preventDefault();
  hideMessages();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { showError('Kérjük töltse ki az összes mezőt.'); return; }
  setLoading(true);
  try {
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      setLoading(false);
      if (error.message.includes('Email not confirmed')) showError('Az email cím még nincs megerősítve.');
      else showError('Hibás email cím vagy jelszó.');
      return;
    }
    const { data: profile } = await db.from('user_profiles').select('role').eq('id', data.user.id).single();
    const role = profile?.role || 'patient';
    showSuccess('Sikeres bejelentkezés! Átirányítás…');
    setTimeout(() => { window.location.href = ROLE_REDIRECTS[role] || 'index.html'; }, 900);
  } catch (err) {
    setLoading(false);
    showError('Hiba történt. Kérjük próbálja újra.');
  }
}

async function forgotPassword(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) { showError('Kérjük először adja meg email címét.'); return; }
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password.html'
  });
  if (error) showError(error.message);
  else showSuccess('Jelszó-visszaállító linket küldtünk a megadott email címre.');
}

async function loginWithGoogle() {
  const { error } = await db.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/index.html' }
  });
  if (error) showError('Google bejelentkezés sikertelen.');
}

function setLoading(on) {
  const btn = document.getElementById('loginBtn');
  const txt = document.getElementById('loginBtnText');
  if (on) {
    btn.disabled = true;
    document.getElementById('loginIcon').outerHTML = '<div class="spinner" id="loginIcon"></div>';
    txt.textContent = 'Bejelentkezés…';
  } else {
    btn.disabled = false;
    document.getElementById('loginIcon').outerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="loginIcon"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>';
    txt.textContent = 'Bejelentkezés';
  }
}

function showError(msg) {
  document.getElementById('msgErrorText').textContent = msg;
  document.getElementById('msgError').classList.add('show');
  document.getElementById('msgSuccess').classList.remove('show');
}
function showSuccess(msg) {
  document.getElementById('msgSuccessText').textContent = msg;
  document.getElementById('msgSuccess').classList.add('show');
  document.getElementById('msgError').classList.remove('show');
}
function hideMessages() {
  document.getElementById('msgError').classList.remove('show');
  document.getElementById('msgSuccess').classList.remove('show');
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin(e);
});

// Ha már be van jelentkezve
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    const { data: profile } = await db.from('user_profiles').select('role').eq('id', session.user.id).single();
    if (profile?.role) window.location.href = ROLE_REDIRECTS[profile.role] || 'index.html';
  }
})();
</script>
</body>
</html>

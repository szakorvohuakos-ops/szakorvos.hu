async function loadArticle() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug') || 'abortusz';
  const wrap = document.getElementById('articleWrap');

  // XSS-safe escape for user-controlled values (URL params)
  const escapeHtml = s => String(s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));

  try {
    // ── 1) Cikk betöltése slug alapján (egzakt match) ──────────────────
    let { data: rows, error } = await db
      .from('knowledge_articles')
      .select('*')
      .eq('slug', slug)
      .limit(1);
    if (error) throw error;

    // ── 2) Ha nincs, részleges (ilike) fallback ───────────────────────
    if (!rows || !rows.length) {
      const fragment = slug.split('-').slice(0, 3).join('-');
      const { data: fb, error: fbErr } = await db
        .from('knowledge_articles')
        .select('*')
        .ilike('slug', `%${fragment}%`)
        .limit(1);
      if (fbErr) throw fbErr;
      rows = fb;
    }

    if (!rows || !rows.length) {
      wrap.innerHTML = `<div class="loading-state" style="grid-column:1/-1"><h2 style="color:#475569;font-family:Inter,sans-serif">Cikk nem található</h2><p style="margin-top:8px;font-size:14px;color:#94a3b8">A keresett cikk (${escapeHtml(slug)}) nem létezik vagy áthelyezték.</p><a href="tudastar.html" style="display:inline-block;margin-top:16px;color:#113293;font-weight:700">← Vissza a tudástárba</a></div>`;
      return;
    }

    const article = rows[0];
    const specialty = article.specialty || guessSpecialty(article.title);
    const icon = SPEC_ICONS[specialty] || '🏥';

    // ── 3) Kapcsolódó cikkek: egyetlen query .or()-ral ─────────────────
    //    Specialty match + ugyanazzal a betűvel kezdődő cím (fallback).
    //    Korábban 2 külön RTT volt — most 1.
    const firstChar = article.title[0]?.toUpperCase() || '';
    let related = [];
    try {
      const orFilter = [
        specialty ? `specialty.eq.${specialty}` : null,
        firstChar ? `title.ilike.${firstChar}%` : null,
      ].filter(Boolean).join(',');

      const { data: relData, error: relErr } = await db
        .from('knowledge_articles')
        .select('title, slug, specialty')
        .or(orFilter)
        .neq('slug', slug)
        .not('content', 'is', null)
        .limit(12);
      if (!relErr && relData) {
        // Prioritás: specialty match előrébb
        related = relData
          .sort((a, b) => {
            const aMatch = a.specialty === specialty ? 0 : 1;
            const bMatch = b.specialty === specialty ? 0 : 1;
            return aMatch - bMatch;
          })
          .slice(0, 6);
      }
    } catch (e) {
      console.warn('[related]', e);
    }

    // SEO meta frissítése – gazdagabb description
    const seoTitle = `${article.title} – tünetek, kezelés, szakorvos | Szakorvos.hu`;
    const seoDesc = article.description
      ? article.description
      : `Részletes útmutató: ${article.title} – tünetek, okok, kezelési lehetőségek és mikor forduljon ${specialty || 'orvos'}hoz. Szakorvos.hu egészségügyi tudástár.`;

    const cleanSlug = slug;
    const canonicalUrl = `https://szakorvos.hu/tudastar/${cleanSlug}`;
    const fallbackUrl  = `https://szakorvos.hu/tudastar-cikk.html?slug=${cleanSlug}`;

    document.getElementById('pageTitle').textContent = seoTitle;
    document.title = seoTitle;
    document.getElementById('pageDesc').setAttribute('content', seoDesc);
    document.getElementById('ogTitle').setAttribute('content', seoTitle);
    document.getElementById('ogDesc').setAttribute('content', seoDesc);
    // Canonical: szép URL ha elérhető, egyébként query-param
    document.getElementById('pageCanonical').setAttribute('href', canonicalUrl);
    document.getElementById('breadcrumbTitle').textContent = article.title;

    // Schema.org JSON-LD – bővített MedicalWebPage
    const schema = {
      "@context": "https://schema.org",
      "@type": "MedicalWebPage",
      "name": article.title,
      "headline": article.title,
      "description": seoDesc,
      "url": canonicalUrl,
      "inLanguage": "hu",
      "dateModified": new Date().toISOString().split('T')[0],
      "publisher": {
        "@type": "Organization",
        "name": "Szakorvos.hu",
        "url": "https://szakorvos.hu",
        "logo": {
          "@type": "ImageObject",
          "url": "https://szakorvos.hu/assets/logo.png"
        }
      },
      "about": {
        "@type": "MedicalCondition",
        "name": article.title
      },
      "specialty": specialty ? { "@type": "MedicalSpecialty", "name": specialty } : undefined,
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Főoldal", "item": "https://szakorvos.hu" },
          { "@type": "ListItem", "position": 2, "name": "Tudástár A–Z", "item": "https://szakorvos.hu/tudastar.html" },
          { "@type": "ListItem", "position": 3, "name": article.title, "item": canonicalUrl }
        ]
      }
    };
    // undefined mezők eltávolítása
    document.getElementById('schemaScript').textContent = JSON.stringify(schema, (k,v) => v === undefined ? undefined : v, 2);

    // Oldal tartalom renderelése - ha van DB tartalom, azt használjuk
    const content = article.content ? article.content : generateContent(article.title, specialty);
    const relatedHtml = related.length ? `
      <div class="sidebar-card">
        <div class="sidebar-card-title">Kapcsolódó cikkek</div>
        ${related.map(r => `
          <a href="tudastar-cikk.html?slug=${encodeURIComponent(r.slug)}" class="related-item" rel="dofollow">
            <div class="related-item-dot"></div>
            <div class="related-item-title">${r.title}</div>
          </a>`).join('')}
      </div>` : '';

    wrap.innerHTML = `
      <!-- Főtartalom -->
      <main class="article-main" itemscope itemtype="https://schema.org/MedicalWebPage">
        <header class="article-header">
          <span class="article-category">${specialty}</span>
          <h1 class="article-title" itemprop="name">${article.title}</h1>
          <div class="article-meta">
            <div class="article-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              Ellenőrzött orvosi tartalom
            </div>
            <div class="article-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              Szakorvos.hu Tudástár
            </div>
          </div>
        </header>

        <article class="article-body" itemprop="text">
          ${content}
        </article>

        <div class="article-disclaimer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Ez az oldal általános tájékoztatást nyújt, és nem helyettesíti a szakorvosi vizsgálatot vagy diagnózist. Ha panaszai vannak, forduljon egészségügyi szakemberhez.</span>
        </div>
      </main>

      <!-- Oldalsáv -->
      <aside class="article-sidebar">
        <div class="sidebar-card cta-card">
          <div class="sidebar-card-title">${icon} ${specialty} szakorvost keres?</div>
          <p>Találja meg a legjobb ${specialty.toLowerCase()} orvost az Ön közelében – értékelések, időpontok, azonnali foglalás.</p>
          <a href="talalatok.html?specialty=${encodeURIComponent(specialty)}" class="cta-btn">
            Szakorvosok keresése
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>

        <div class="sidebar-card">
          <div class="sidebar-card-title">Kapcsolódó szakterületek</div>
          ${getRelatedSpecialties(specialty).map(([spec, ic]) => `
            <a href="talalatok.html?specialty=${encodeURIComponent(spec)}" class="specialty-badge">
              <span class="specialty-badge-icon">${ic}</span>
              <span class="specialty-badge-text">${spec} szakorvos</span>
            </a>`).join('')}
        </div>

        ${relatedHtml}

        <div class="sidebar-card">
          <div class="sidebar-card-title">AI Egészségügyi Elemzés</div>
          <p style="font-size:13px;color:#475569;line-height:1.6;margin-bottom:12px">Írja le tüneteit, és AI asszisztensünk azonnal megmondja melyik szakorvoshoz érdemes fordulni.</p>
          <a href="index.html#ai-widget" style="display:flex;align-items:center;justify-content:center;gap:8px;background:#f0f8f3;border:1.5px solid #c8e8d2;color:#1f6e3a;border-radius:10px;padding:10px 16px;text-decoration:none;font-size:13px;font-weight:700;transition:all .15s">
            🤖 AI elemzés indítása
          </a>
        </div>
      </aside>
    `;

  } catch(e) {
    console.error(e);
    wrap.innerHTML = `<div class="loading-state" style="grid-column:1/-1"><h2 style="color:#475569;font-family:Inter,sans-serif">Hiba történt</h2><p style="margin-top:8px;font-size:14px;color:#94a3b8">Nem sikerült betölteni a cikket.</p><a href="tudastar.html" style="display:inline-block;margin-top:16px;color:#113293;font-weight:700">← Vissza a tudástárba</a></div>`;
  }
}

loadArticle();
</script>
</body>
</html>

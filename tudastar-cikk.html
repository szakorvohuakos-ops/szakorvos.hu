// Szakterület hozzárendelés kulcsszavak alapján
function guessSpecialty(title) {
  const t = title.toLowerCase();
  // Fogászat – elsőként, mert 'fog' más szavakban is előfordul
  if (/fog|fogszabályozó|fogíny|fogsor|fogtömés|fogfehér|fogcsikorgatás|fogkő|gyökérkezelés|szájüreg|szájrák|szájsebész/.test(t)) return 'Fogászat';
  if (/szív|kardio|angina|aritmia|pitvar|aorta|bypass|vérnyomás|szívroham|szívzörej/.test(t)) return 'Kardiológia';
  if (/agy|neuro|stroke|migrain|fejfáj|epilep|parkinson|sclerosis|alzheimer|demencia/.test(t)) return 'Neurológia';
  if (/bőr|dermat|ekcéma|pattanás|pikkelysömör|rosacea|melanoma|bőrrák|anyajegy|akne|vitiligo/.test(t)) return 'Bőrgyógyászat';
  if (/gyomor|bél|hasnyál|máj|kolonosz|gastro|reflux|széklet|epehólyag|vastagbél/.test(t)) return 'Gasztroenterológia';
  if (/csont|ízület|térd|csípő|gerinc|artritisz|ortopéd|vállfájdalom|boka|rándulás|törés/.test(t)) return 'Ortopédia';
  if (/szem|látás|glaukoma|katarakt|retina|szaruhártya|szemhéj/.test(t)) return 'Szemészet';
  if (/méh|petefészek|menstruáció|menopauza|terhes|nőgyógyász|hüvely|szülés|mellrák/.test(t)) return 'Nőgyógyászat';
  if (/pszicho|depressz|szorongás|bipoláris|skizofrénia|pánik|fóbia|önkárosítás/.test(t)) return 'Pszichológia';
  if (/cukorbeteg|inzulin|pajzsmirigy|hormon|endokrin|metabol|mellékvese/.test(t)) return 'Endokrinológia';
  if (/gyermek|baba|csecsemő|pubertás|pelenkakiütés/.test(t)) return 'Gyermekgyógyászat';
  if (/vizelet|vese|urológ|prosztata|húgyhólyag|húgyúti/.test(t)) return 'Urológia';
  if (/fül|orr|torok|hallás|gégész|mandula|orrvérzés|fülzúgás/.test(t)) return 'Fül-orr-gégészet';
  if (/rák|daganat|tumor|onkológ|kemoterápia|lymphoma|leukémia/.test(t)) return 'Onkológia';
  if (/allergia|allergiás|szénanátha/.test(t)) return 'Allergológia';
  if (/reuma|arthritis|polymyalgia/.test(t)) return 'Reumatológia';
  if (/tüdő|légzés|asztma|bronch|köhögés|copd/.test(t)) return 'Belgyógyászat';
  return 'Belgyógyászat';
}

async function loadArticle() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug') || 'abortusz';
  const wrap = document.getElementById('articleWrap');

  try {
    // Cikk betöltése slug alapján
    let res = await fetch(
      `${SUPABASE_URL}/rest/v1/knowledge_articles?slug=eq.${encodeURIComponent(slug)}&select=*&limit=1`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    let data = await res.json();

    // Ha nem találja slug alapján, próbálja részleges egyezéssel (fallback)
    if (!data || !data.length) {
      res = await fetch(
        `${SUPABASE_URL}/rest/v1/knowledge_articles?slug=ilike.${encodeURIComponent('*' + slug.split('-').slice(0,3).join('-') + '*')}&select=*&limit=1`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
      );
      data = await res.json();
    }

    if (!data || !data.length) {
      wrap.innerHTML = `<div class="loading-state" style="grid-column:1/-1"><h2 style="color:#374151;font-family:Nunito,sans-serif">Cikk nem található</h2><p style="margin-top:8px;font-size:14px;color:#9aa5c4">A keresett cikk (${slug}) nem létezik vagy áthelyezték.</p><a href="tudastar.html" style="display:inline-block;margin-top:16px;color:#283897;font-weight:700">← Vissza a tudástárba</a></div>`;
      return;
    }

    const article = data[0];
    const specialty = article.specialty || guessSpecialty(article.title);
    const icon = SPEC_ICONS[specialty] || '🏥';

    // Kapcsolódó cikkek betöltése (azonos kezdőbetű)
    const firstChar = article.title[0].toUpperCase();
    const relRes = await fetch(
      `${SUPABASE_URL}/rest/v1/knowledge_articles?title=like.${encodeURIComponent(firstChar + '%')}&slug=neq.${encodeURIComponent(slug)}&select=title,slug&limit=6`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    const related = await relRes.json();

    // SEO meta frissítése
    const seoTitle = `${article.title} – Egészségügyi útmutató | Szakorvos.hu`;
    const seoDesc = `Tudjon meg mindent a(z) ${article.title} témáról. Tünetek, kezelés, ajánlott szakorvos – a Szakorvos.hu egészségügyi tudástárában.`;

    document.getElementById('pageTitle').textContent = seoTitle;
    document.title = seoTitle;
    document.getElementById('pageDesc').setAttribute('content', seoDesc);
    document.getElementById('ogTitle').setAttribute('content', seoTitle);
    document.getElementById('ogDesc').setAttribute('content', seoDesc);
    document.getElementById('pageCanonical').setAttribute('href', `https://szakorvos.hu/tudastar-cikk.html?slug=${slug}`);
    document.getElementById('breadcrumbTitle').textContent = article.title;

    // Schema.org JSON-LD
    const schema = {
      "@context": "https://schema.org",
      "@type": "MedicalWebPage",
      "name": article.title,
      "description": seoDesc,
      "url": `https://szakorvos.hu/tudastar-cikk.html?slug=${slug}`,
      "inLanguage": "hu",
      "publisher": {
        "@type": "Organization",
        "name": "Szakorvos.hu",
        "url": "https://szakorvos.hu"
      },
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Főoldal", "item": "https://szakorvos.hu" },
          { "@type": "ListItem", "position": 2, "name": "Tudástár A–Z", "item": "https://szakorvos.hu/tudastar.html" },
          { "@type": "ListItem", "position": 3, "name": article.title, "item": `https://szakorvos.hu/tudastar-cikk.html?slug=${slug}` }
        ]
      }
    };
    document.getElementById('schemaScript').textContent = JSON.stringify(schema, null, 2);

    // Oldal tartalom renderelése - ha van DB tartalom, azt használjuk
    const content = article.content ? article.content : generateContent(article.title, specialty);
    const relatedHtml = related.length ? `
      <div class="sidebar-card">
        <div class="sidebar-card-title">Kapcsolódó cikkek</div>
        ${related.map(r => `
          <a href="tudastar-cikk.html?slug=${encodeURIComponent(r.slug)}" class="related-item">
            <div class="related-item-dot"></div>
            <div class="related-item-title">${r.title}</div>
          </a>`).join('')}
      </div>` : '';

    wrap.innerHTML = `
      <!-- Főtartalom -->
      <main class="article-main" itemscope itemtype="https://schema.org/MedicalWebPage">
        <header class="article-header">
          <span class="article-category">${specialty}</span>
          <h1 class="article-title" itemprop="name">${article.title}</h1>
          <div class="article-meta">
            <div class="article-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9aa5c4" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              Ellenőrzött orvosi tartalom
            </div>
            <div class="article-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9aa5c4" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              Szakorvos.hu Tudástár
            </div>
          </div>
        </header>

        <article class="article-body" itemprop="text">
          ${content}
        </article>

        <div class="article-disclaimer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa5c4" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Ez az oldal általános tájékoztatást nyújt, és nem helyettesíti a szakorvosi vizsgálatot vagy diagnózist. Ha panaszai vannak, forduljon egészségügyi szakemberhez.</span>
        </div>
      </main>

      <!-- Oldalsáv -->
      <aside class="article-sidebar">
        <div class="sidebar-card cta-card">
          <div class="sidebar-card-title">${icon} ${specialty} szakorvost keres?</div>
          <p>Találja meg a legjobb ${specialty.toLowerCase()} orvost az Ön közelében – értékelések, időpontok, azonnali foglalás.</p>
          <a href="talalatok.html?specialty=${encodeURIComponent(specialty)}" class="cta-btn">
            Szakorvosok keresése
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>

        <div class="sidebar-card">
          <div class="sidebar-card-title">Kapcsolódó szakterületek</div>
          ${getRelatedSpecialties(specialty).map(([spec, ic]) => `
            <a href="talalatok.html?specialty=${encodeURIComponent(spec)}" class="specialty-badge">
              <span class="specialty-badge-icon">${ic}</span>
              <span class="specialty-badge-text">${spec} szakorvos</span>
            </a>`).join('')}
        </div>

        ${relatedHtml}

        <div class="sidebar-card">
          <div class="sidebar-card-title">AI Egészségügyi Elemzés</div>
          <p style="font-size:13px;color:#6b7280;line-height:1.6;margin-bottom:12px">Írja le tüneteit, és AI asszisztensünk azonnal megmondja melyik szakorvoshoz érdemes fordulni.</p>
          <a href="index.html#ai-widget" style="display:flex;align-items:center;justify-content:center;gap:8px;background:#f0fdf4;border:1.5px solid #bbf7d0;color:#166534;border-radius:10px;padding:10px 16px;text-decoration:none;font-size:13px;font-weight:700;transition:all .15s">
            🤖 AI elemzés indítása
          </a>
        </div>
      </aside>
    `;

  } catch(e) {
    console.error(e);
    wrap.innerHTML = `<div class="loading-state" style="grid-column:1/-1"><h2 style="color:#374151;font-family:Nunito,sans-serif">Hiba történt</h2><p style="margin-top:8px;font-size:14px;color:#9aa5c4">Nem sikerült betölteni a cikket.</p><a href="tudastar.html" style="display:inline-block;margin-top:16px;color:#283897;font-weight:700">← Vissza a tudástárba</a></div>`;
  }
}

loadArticle();
</script>
</body>
</html>
